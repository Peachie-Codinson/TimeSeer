services:
  app:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    restart: unless-stopped
    volumes:
      - planner_data:/data
    environment:
      DATABASE_PATH: /data/planner.db
      ATTACHMENTS_DIR: /data/attachments
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}

  caddy:
    image: caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  planner_data:
  caddy_data:
  caddy_config:
